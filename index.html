<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="%BASE_URL%assets/logo-roque.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roque Tattoo" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet" />
    <title>Roque Tattoo Ink</title>
    <style>
      html, body, #root { margin: 0; height: 100%; }
      body { background: #050506; font-family: Inter, Helvetica, Arial, sans-serif; color: #F2F2F2; }
      button, input, select { font-family: inherit; }
      * { scrollbar-width: none; }
      *::-webkit-scrollbar { display: none; width: 0; height: 0; }
      @keyframes fi { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      @keyframes led { 0%, 100% { opacity: .4 } 50% { opacity: 1; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.85) } }
      @keyframes disco {
        0%, 100% { background: #ff3df2; box-shadow: 0 0 10px #ff3df2; opacity: 1 }
        20% { background: #3de8ff; box-shadow: 0 0 10px #3de8ff; opacity: .55 }
        40% { background: #7dff4d; box-shadow: 0 0 10px #7dff4d; opacity: 1 }
        60% { background: #ffd23d; box-shadow: 0 0 10px #ffd23d; opacity: .55 }
        80% { background: #9b5cff; box-shadow: 0 0 10px #9b5cff; opacity: 1 }
      }
      @keyframes eq { 0%, 100% { transform: scaleY(.25) } 50% { transform: scaleY(1) } }
      input::placeholder { color: #6b6b70; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
