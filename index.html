<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="%BASE_URL%assets/logo-roque.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roque Tattoo" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet" />
    <title>Roque Tattoo Ink</title>
    <style>
      html, body, #root { margin: 0; height: 100%; }
      body { background: #050506; font-family: Inter, Helvetica, Arial, sans-serif; color: #F2F2F2; }
      button, input, select { font-family: inherit; }
      * { scrollbar-width: none; }
      *::-webkit-scrollbar { display: none; width: 0; height: 0; }
      @keyframes fi { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      @keyframes led { 0%, 100% { opacity: .4 } 50% { opacity: 1; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.85) } }
      @keyframes disco {
        0%, 100% { background: #ffffff; box-shadow: 0 0 10px rgba(255,255,255,.9); opacity: 1 }
        20% { background: #b8c4d0; box-shadow: 0 0 9px rgba(184,196,208,.8); opacity: .6 }
        40% { background: #e9e3d8; box-shadow: 0 0 10px rgba(233,227,216,.85); opacity: 1 }
        60% { background: #8f959e; box-shadow: 0 0 7px rgba(143,149,158,.7); opacity: .5 }
        80% { background: #d6dde4; box-shadow: 0 0 10px rgba(214,221,228,.85); opacity: 1 }
      }
      @keyframes eq { 0%, 100% { transform: scaleY(.25) } 50% { transform: scaleY(1) } }
      input::placeholder { color: #6b6b70; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
